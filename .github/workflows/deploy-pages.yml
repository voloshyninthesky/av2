name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Editing prices.json is enough to change the published prices: this
      # writes them into the static pages before anything checks or ships them,
      # so a price update needs no HTML edit and cannot fail the build.
      - name: Sync prices into the /uk pages
        run: node tools/sync-prices.mjs

      - name: Test
        run: node --test tests/*.test.mjs

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -R css fonts img js uk vendor index.html favicon.ico favicon.svg apple-touch-icon.png prices.json piano-notes.json robots.txt sitemap.xml .nojekyll CNAME _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
