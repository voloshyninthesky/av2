server {
  listen 80;
  listen [::]:80;
  server_name vibe2.ton.zone;

  root /var/www/vibe2.ton.zone/releases/20260728T124828Z;
  index index.html;

  access_log /var/log/nginx/vibe2.ton.zone.access.log;
  error_log /var/log/nginx/vibe2.ton.zone.error.log warn;

  location /.well-known/acme-challenge/ {
    root /var/www/vibe2.ton.zone/releases/20260728T124828Z;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name vibe2.ton.zone;

  root /var/www/vibe2.ton.zone/releases/20260728T124828Z;
  index index.html;

  ssl_certificate /etc/letsencrypt/live/vibe2.ton.zone/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/vibe2.ton.zone/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  access_log /var/log/nginx/vibe2.ton.zone.access.log;
  error_log /var/log/nginx/vibe2.ton.zone.error.log warn;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|mjs|jpg|jpeg|png|webp|svg|woff2)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }
}
